<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PostKeeper extension settings</title>
    <link rel="stylesheet" href="extension.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <h1>PostKeeper extension settings</h1>
      <form id="settings-form">
        <label>
          PostKeeper PWA URL
          <input id="pwa-url" name="pwa-url" type="url" required />
        </label>
        <p>
          Use the exact installed PWA address. HTTPS is required except for localhost development.
        </p>
        <button type="submit">Save settings</button>
      </form>
      <p id="status" role="status"></p>
      <p>
        <a href="https://keep.fishese.cc/extensions.html" target="_blank" rel="noopener noreferrer"
          >Installation guide</a
        >
      </p>
    </main>
  </body>
</html>
