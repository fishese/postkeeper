services:
  postkeeper-pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.40.4
        PB_SHA256: 9042ec818570e79c3628dadcd0a756c1496d9e1173918ec409d133c02f82e5fa
    restart: unless-stopped
    environment:
      POSTKEEPER_MAX_USER_BYTES: '2147483648'
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - ./data:/pb/pb_data
